# Pull-request check: compile and run the ctest suite on the oldest supported Qt.
#
# Why Ubuntu 24.04: it ships Qt 6.4.2, the project's minimum. A green run here proves the
# code does not use a newer Qt API. The result shows as a check on the PR; the ctest
# output is also written to the run summary.
#
# One Linux job of a few minutes; an older run of the same ref is cancelled when a new
# commit arrives, and documentation-only changes do not trigger it. Packages are NOT built here
# (see packages.yml).
name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (Ubuntu 24.04, Qt 6.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libsqlite3-dev nlohmann-json3-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Show the Qt version in use
        run: dpkg-query -W qt6-base-dev

      - name: Configure
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure | tee ctest.log

      - name: Summarise tests in the run summary
        if: always()
        run: |
          {
            echo '### ctest'
            echo '```'
            tail -n 40 ctest.log 2>/dev/null || echo 'no ctest output (build failed?)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: |
            ctest.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
